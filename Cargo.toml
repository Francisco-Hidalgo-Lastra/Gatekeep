[package]
name = "gatekeep"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
eframe = { version = "0.37.0", features = ["persistence"] }
env_logger = "0.11.11"
html2text = "0.17.4"
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
imap-proto = "0.16.7"
keyring = "4.2.0"
log = "0.4.35"
mail-parser = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
ureq = "3.5.2"
